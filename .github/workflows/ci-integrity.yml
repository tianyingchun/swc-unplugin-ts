name: CI-unitest

on:
  push:
    branches:
      - main
      - major
      - minor
    # Only consider those paths to trigger the action
    paths:
      - 'src/**'
      - 'test/**'
      - 'tests/**'
      - 'packages/**'
      - 'package.json'
      - '*.lock'
      - '.yarnrc.yml'
      - 'tsconfig*.json'
      - '.prettier*'
      - '.github/**'

  pull_request:
    branches:
      - main
      - major
      - minor
    types:
      - opened
      - synchronize
      - reopened
    # Only consider those paths to trigger the action
    paths:
      - 'src/**'
      - 'test/**'
      - 'tests/**'
      - 'packages/**'
      - 'package.json'
      - '*.lock'
      - '.yarnrc.yml'
      - 'tsconfig*.json'
      - '.prettier*'
      - '.github/**'

jobs:
  test:
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 = minimum supported (unplugin@3 requires ^20.19.0 || >=22.12.0)
        # 22 = current active LTS, also the floor for consumers on the >= branch
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📥 Install Dependencies
        run: yarn --frozen-lockfile

      - name: Typecheck
        run: |
          yarn typecheck

      - name: Linter
        run: |
          yarn lint

      - name: Build
        run: |
          yarn build

      - name: Unit tests
        run: |
          yarn test
